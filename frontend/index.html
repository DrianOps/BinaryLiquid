<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>BinaryLiquid | The #1 Cross-Chain Liquidity Gateway for Bitcoin Cash</title>
    <meta name="description" content="The #1 Cross-Chain Liquidity Gateway connecting EVM stablecoins (USDC, USDT) and Bitcoin Cash CashTokens (ParyonUSD) in seconds. Sponsored by BCH BLAZE." />
    <meta name="theme-color" content="#F7931A" />

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('bliq_theme');
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#080B11';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#FAFAF9';
          }
        } catch(e) {}
      })();
    </script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
      }
      html.dark, html.dark body {
        background-color: #080B11 !important;
        color: #f1f5f9;
        color-scheme: dark;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #FAFAF9 !important;
        color: #111827;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      html.dark .initial-loader {
        background-color: #080B11;
        color: #f1f5f9;
      }
      html:not(.dark) .initial-loader {
        background-color: #FAFAF9;
        color: #111827;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: relative;
        overflow: hidden;
      }
      .heartbeat-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 140px;
      }
      .heartbeat-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(247, 147, 26, 0.45) 0%, rgba(247, 147, 26, 0.12) 50%, rgba(247, 147, 26, 0) 75%);
        animation: heart-glow 1.35s infinite ease-in-out;
        pointer-events: none;
      }
      .heartbeat-ring {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 2px solid rgba(247, 147, 26, 0.4);
        animation: heart-ring 1.35s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        pointer-events: none;
      }
      .initial-loader img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        position: relative;
        z-index: 2;
        animation: heartbeat 1.35s infinite ease-in-out;
        will-change: transform, filter;
      }

      /* Authentic Cardiac Heartbeat (Lub-Dub Rhythmic Pulse) */
      @keyframes heartbeat {
        0% {
          transform: scale(1);
          filter: drop-shadow(0 0 0px rgba(247, 147, 26, 0));
        }
        14% {
          transform: scale(1.16);
          filter: drop-shadow(0 0 16px rgba(247, 147, 26, 0.65));
        }
        28% {
          transform: scale(1.03);
          filter: drop-shadow(0 0 6px rgba(247, 147, 26, 0.25));
        }
        42% {
          transform: scale(1.28);
          filter: drop-shadow(0 0 32px rgba(247, 147, 26, 0.9));
        }
        70% {
          transform: scale(1);
          filter: drop-shadow(0 0 2px rgba(247, 147, 26, 0.1));
        }
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0px rgba(247, 147, 26, 0));
        }
      }

      @keyframes heart-glow {
        0% {
          transform: scale(0.9);
          opacity: 0.2;
        }
        14% {
          transform: scale(1.18);
          opacity: 0.7;
        }
        28% {
          transform: scale(1.02);
          opacity: 0.3;
        }
        42% {
          transform: scale(1.36);
          opacity: 0.95;
        }
        70% {
          transform: scale(1);
          opacity: 0.25;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.2;
        }
      }

      @keyframes heart-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.8;
        }
        42% {
          transform: scale(1.5);
          opacity: 0.15;
        }
        70% {
          transform: scale(1.75);
          opacity: 0;
        }
        100% {
          transform: scale(0.8);
          opacity: 0;
        }
      }
    </style>
  </head>

  <body class="antialiased font-sans">
    <div id="root">
      <div class="initial-loader">
        <div class="heartbeat-wrapper">
          <div class="heartbeat-glow"></div>
          <div class="heartbeat-ring"></div>
          <img src="/logo.png" alt="BinaryLiquid Loading" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
